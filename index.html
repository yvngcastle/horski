<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cobain.lol</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .site-note {
      position: fixed;
      inset: auto 1rem max(1.5rem, env(safe-area-inset-bottom));
      margin: 0;
      text-align: center;
      color: #666;
      font: 13px/1.4 system-ui, sans-serif;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <p class="site-note">Site under construction.</p>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0xffffff);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.domElement.setAttribute('role', 'img');
    renderer.domElement.setAttribute('aria-label', 'Spinning 3D text');
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 3));

    for (const [x, y, z, intensity] of [
      [3, 5, 5, 5],
      [-4, 1, 3, 3],
      [0, 3, -5, 4]
    ]) {
      const light = new THREE.DirectionalLight(0xffffff, intensity);
      light.position.set(x, y, z);
      scene.add(light);
    }

    const pivot = new THREE.Group();
    scene.add(pivot);

    let radius = 1;
    let previousTime;
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      const halfVerticalFov = THREE.MathUtils.degToRad(camera.fov / 2);
      const halfHorizontalFov = Math.atan(
        Math.tan(halfVerticalFov) * camera.aspect
      );
      const limitingFov = Math.min(halfVerticalFov, halfHorizontalFov);

      camera.position.z = radius / Math.sin(limitingFov) * 1.18;
      camera.far = Math.max(100, camera.position.z + radius * 2);
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }

    new GLTFLoader().load('./text.glb', ({ scene: model }) => {
      model.rotation.x = Math.PI / 2;
      model.updateMatrixWorld(true);

      const bounds = new THREE.Box3().setFromObject(model);
      model.position.sub(bounds.getCenter(new THREE.Vector3()));
      radius = bounds.getSize(new THREE.Vector3()).length() / 2;

      pivot.add(model);
      resize();
    }, undefined, error => {
      console.error('Could not load text.glb', error);
    });

    resize();
    addEventListener('resize', resize);

    renderer.setAnimationLoop(time => {
      if (previousTime !== undefined && !reducedMotion.matches) {
        const seconds = Math.min(time - previousTime, 50) / 1000;
        pivot.rotation.y += seconds * 0.55;
      }

      previousTime = time;
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
